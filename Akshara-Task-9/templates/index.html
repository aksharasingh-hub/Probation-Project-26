<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adult Income Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 25px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #2463eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .results {
            margin-top: 25px;
            padding: 15px;
            background: #e8f4ff;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Adult Income Prediction</h1>

    <p>Enter the person's details below.</p>

    <form action="/predict" method="POST">

        <label>Age</label>
        <input type="number" name="age" min="17" max="100" value="{{form_data.age if form_data else 30}}" required>

        <label>Workclass</label>
        <select name="workclass" required>
            {% for item in [
                'Private',
                'Self-emp-not-inc',
                'Self-emp-inc',
                'Federal-gov',
                'Local-gov',
                'State-gov',
                'Without-pay',
                'Never-worked'
            ] %}
                <option value="{{ item }}"
                    {% if form_data and form_data.workclass == item %}selected{% endif %}>
                    {{ item }}
                </option>
            {% endfor %}
        </select>

        <label>Final Weight (fnlwgt)</label>
        <input type="number" name="fnlwgt" min="1" value="{{form_data.fnlwgt if form_data else 100000}}" required>

        <label>Education</label>
        <select name="education" required>
            {% for item in [
                'HS-grad', 'Bachelors', 'Some-college','Masters', 'Doctorate', 'Assoc-voc','Assoc-acdm', '11th', '10th', '9th',
                '12th', '7th-8th', '5th-6th','1st-4th', 'Preschool', 'Prof-school'
            ] %}
                <option value="{{ item }}"
                    {% if form_data and form_data.education == item %}selected{% endif %}>
                    {{ item }}
                </option>
            {% endfor %}
        </select>
        <label>Education Number</label>
        <input type="number" name="education.num" min="1" max="16" value="{{form_data['education.num'] if form_data else 10}}" required>

        <label>Marital Status</label>
        <select name="marital.status" required>
            {% for item in [
                'Never-married','Married-civ-spouse','Divorced','Separated','Widowed','Married-spouse-absent','Married-AF-spouse'
            ] %}
                <option value="{{ item }}"
                  {% if form_data and form_data['marital.status'] == item %}selected{% endif %}>
                  {{ item }}
                </option>
            {% endfor %}

        </select>

        <label>Occupation</label>
        <select name="occupation" required> 
            
          {% for item in ['Prof-specialty','Craft-repair','Exec-managerial','Adm-clerical','Sales','Other-service','Machine-op-inspct',
                          'Transport-moving','Handlers-cleaners','Farming-fishing','Tech-support','Protective-serv','Priv-house-serv','Armed-Forces'
          ] %}
            <option value="{{ item }}"
              {% if form_data and form_data.occupation == item %}selected{% endif %}>
              {{ item }}
            </option>
          {% endfor %}

        </select>

        <label>Relationship</label>
        <select name="relationship" required>
            {% for item in['Husband','Not-in-family','Own-child','Unmarried','Wife','Other-relative']%}
                <option value ="{{ item }}"
                  {% if form_data and form_data.relationship == item %}selected{% endif %}>
                  {{ item }}
                </option>
            {% endfor %}

        </select>

        <label>Race</label>
        <select name="race" required>
            {% for item in['White','Black','Asian-Pac-Islander','Amer-In dianp-Eskimo','Other']%}
                <option value ="{{ item }}"
                  {% if form_data and form_data.race == item %}selected{% endif %}>
                  {{ item }}
                </option>
            {% endfor %}
        </select>

        <label>Sex</label>
        <select name="sex" required>
            {% for item in['Female','Male']%}
                <option value ="{{ item }}"
                  {% if form_data and form_data.sex == item %}selected{% endif %}>
                  {{ item }}
                </option>
            {% endfor %}
        </select>

        <label>Capital Gain</label>
        <input type="number" name="capital.gain" min="0" value="{{form_data['capital.gain']if form_data else 0 }}" required>

        <label>Capital Loss</label>
        <input type="number" name="capital.loss" min="0" value="{{form_data['capital_loss']if form_data else 0 }}" required>

        <label>Hours per Week</label>
        <input type="number" name="hours.per.week" min="1" max="99" value="{{form_data['hours.per.week']if form_data else 40}}" required>

        <label>Native Country</label>
        <select name="native.country" required> 
            {% for item in ['United-States','India','Mexico','Canada','Germany','Philippines','England','Other']%}
                <option value ="{{ item }}"
                  {% if form_data and form_data.Native Country == item %}selected{% endif %}>
                  {{ item }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">Predict Income</button>

    </form>
    {% if predictions %}
    <div class="results">
        <h2>Prediction Results</h2>
        {% for model_name, result in predictions.items() %}
            <p>
                <strong>{{ model_name }}:</strong>
                {{ result }}
            </p>
        {% endfor %}
        <p>
            These are model predictions, not guaranteed actual income.
        </p>

    </div>
    {% endif %}
</div>
</body>
</html>
